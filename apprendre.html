<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apprendre - Pokémon</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/navbar.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body data-page="apprendre">
    <header class="site-header">
        <h1>APPRENDRE</h1>
        <div id="navbar-container"></div>
    </header>

    <main class="page-content">
        <h2>Questions et réponses Pokémon</h2>
        <p>Retrouve ici les questions du quiz et leurs bonnes réponses.</p>
        <p id="questions-status" class="status-message" role="status" aria-live="polite">Chargement des questions…</p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th scope="col">N°</th>
                        <th scope="col">Thème</th>
                        <th scope="col">Question</th>
                        <th scope="col">Bonne réponse</th>
                        <th scope="col">Points</th>
                        <th scope="col">Détail</th>
                    </tr>
                </thead>
                <tbody id="questions-list"></tbody>
            </table>
        </div>
    </main>
</body>
</html>
